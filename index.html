<style>
:root{--bg:#16181d;--panel:#1d2027;--fg:#e9edf1;--mute:#9aa3ae;--p1:#00d2ff;--p2:#f26a21;--sun:#f26a21;--line:#2b2f39;
 --display:"Anton","Bebas Neue",Impact,"Arial Narrow Bold",sans-serif;
 --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;padding:20px 14px 40px}
main{max-width:860px;margin:0 auto}
h1{font:400 clamp(2rem,7vw,3.2rem)/1 var(--display);margin:0 0 6px;letter-spacing:.02em;text-transform:uppercase}
h1 span{color:var(--p1)}
.tabs button,.btn,.pad button{font-family:var(--display);font-weight:400;letter-spacing:.04em;text-transform:uppercase}
.bar,.hint,.ctl label,.ctl select,.sub{font-family:var(--mono)}
.sub{font-size:.85rem}
.sub{color:var(--mute);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font-size:1.15rem;padding:12px;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;cursor:pointer}
.tabs button[aria-selected=true]{border-color:var(--sun);color:var(--sun)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.game{display:none}.game.on{display:block}
canvas{display:block;width:100%;height:auto;border-radius:12px;border:2px solid var(--line);background:#000;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:10px 0;color:var(--mute);font-size:.95rem}
.bar b{color:var(--fg)}
.btn{font-size:1.05rem;padding:9px 16px;border:0;border-radius:8px;background:var(--sun);color:#16181d;cursor:pointer}
.btn.alt{background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-top:10px}
.ctl label{display:block;font-size:.85rem;color:var(--mute)}
.ctl input[type=range]{width:100%;accent-color:var(--sun)}
.ctl select{font:inherit;padding:8px;border-radius:8px;background:var(--panel);color:var(--fg);border:2px solid var(--line);width:100%}
#snakeWrap{max-width:420px;margin:0 auto}

.pad .u{grid-column:2}.pad .l{grid-row:2;grid-column:1}.pad .d{grid-row:2;grid-column:2}.pad .r{grid-row:2;grid-column:3}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
.hint{color:var(--mute);font-size:.85rem;margin-top:8px}

<body>
<main>
 <h1>Arcade<span>.</span></h1>
 <p class="sub">Two classics, rebuilt for the browser. Pick one and play.</p>
 <div class="tabs" role="tablist">
  <button role="tab" id="t-tank" aria-selected="true">Tank Wars</button>
  <button role="tab" id="t-snake" aria-selected="false">Snake</button>
 </div>

 <section class="game on" id="g-tank">
  <canvas id="tank" width="800" height="450" aria-label="Tank Wars board"></canvas>
  <div class="bar"><span id="tmsg"><b style="color:#00d2ff">Blue</b> to fire</span><span>Wind <b id="wind"></b></span></div>
  <div class="ctl">
   <div><label>Angle <b id="av"></b>°</label><input id="ang" type="range" min="0" max="180" value="45"></div>
   <div><label>Power <b id="pv"></b></label><input id="pow" type="range" min="10" max="100" value="55"></div>
   <button class="btn" id="fire">Fire</button>
   <div><label for="mode">Mode</label><select id="mode"><option value="cpu">1 player vs CPU</option><option value="two">2 players</option></select></div>
   <button class="btn alt" id="tnew">New battle</button>
  </div>
  <p class="hint">Keys: ←/→ angle, ↑/↓ power, Space to fire. Shells carve craters and wind pushes them off course.</p>
 </section>

 <section class="game" id="g-snake">
  <div id="snakeWrap">
   <canvas id="snake" width="400" height="400" aria-label="Snake board"></canvas>
   <div class="bar"><span>Score <b id="sc">0</b></span><span>Best <b id="hi">0</b></span><button class="btn alt" id="snew">Restart</button></div>
   <div class="pad"><button class="u" data-d="u" aria-label="Up">▲</button><button class="l" data-d="l" aria-label="Left">◀</button><button class="d" data-d="d" aria-label="Down">▼</button><button class="r" data-d="r" aria-label="Right">▶</button></div>
   <p class="hint">Arrow keys or WASD to steer, swipe on touch screens. Space pauses.</p>
  </div>
 </section>
</main>

<script>
const $=id=>document.getElementById(id);
let active='tank';
function show(n){active=n;['tank','snake'].forEach(k=>{$('g-'+k).classList.toggle('on',k===n);$('t-'+k).setAttribute('aria-selected',k===n)});if(n!=='snake')snakePause(true)}
$('t-tank').onclick=()=>show('tank');$('t-snake').onclick=()=>show('snake');
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'&&e.target.tagName!=='BUTTON')e.preventDefault()});

/* ================= TANK WARS ================= */
(()=>{
const c=$('tank'),x=c.getContext('2d'),W=800,H=450,G=.1,R=36;
let h,tanks,cur,wind,state,shot,boom,t0,aiTimer;
const cols=['#00d2ff','#f26a21'],names=['Blue','Orange'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function gen(){const p=[Math.random()*6,Math.random()*6,Math.random()*6];h=new Float32Array(W);
 for(let i=0;i<W;i++){const mid=1-Math.abs(i-W/2)/(W/2);h[i]=clamp(300-mid*40+40*Math.sin(i*.009+p[0])+22*Math.sin(i*.025+p[1])+9*Math.sin(i*.07+p[2]),150,410)}}
function newGame(){clearTimeout(aiTimer);gen();
 tanks=[{x:80+Math.random()*60,hp:100,a:45,p:55},{x:W-140+Math.random()*60,hp:100,a:135,p:55}];
 cur=0;state='aim';shot=null;boom=null;newWind();ui();msg()}
function newWind(){wind=+((Math.random()-.5)*.05).toFixed(3)}
const gy=t=>h[clamp(Math.round(t.x),0,W-1)];
function ui(){const t=tanks[cur];$('ang').value=t.a;$('pow').value=t.p;$('av').textContent=t.a;$('pv').textContent=t.p;
 const w=Math.round(Math.abs(wind)*400);$('wind').textContent=(wind<0?'← ':'')+w+(wind>0?' →':'')}
function msg(t){$('tmsg').innerHTML=t||`<b style="color:${cols[cur]}">${names[cur]}</b> to fire`}
const isCpu=()=>$('mode').value==='cpu'&&cur===1;
function canAct(){return state==='aim'&&!isCpu()}
$('ang').oninput=e=>{if(canAct()){tanks[cur].a=+e.target.value;ui()}else ui()};
$('pow').oninput=e=>{if(canAct()){tanks[cur].p=+e.target.value;ui()}else ui()};
function launch(){const t=tanks[cur],a=t.a*Math.PI/180,v=t.p*.1;
 shot={x:t.x+Math.cos(a)*18,y:gy(t)-12-Math.sin(a)*18,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,trail:[]};state='fly';msg(`<b style="color:${cols[cur]}">${names[cur]}</b> fired…`)}
function fire(){if(canAct())launch()}
$('fire').onclick=fire;$('tnew').onclick=newGame;$('mode').onchange=newGame;
addEventListener('keydown',e=>{if(active!=='tank'||!canAct()||e.target.tagName==='SELECT')return;const t=tanks[cur];
 if(e.key==='ArrowLeft')t.a=clamp(t.a+1,0,180);else if(e.key==='ArrowRight')t.a=clamp(t.a-1,0,180);
 else if(e.key==='ArrowUp')t.p=clamp(t.p+1,10,100);else if(e.key==='ArrowDown')t.p=clamp(t.p-1,10,100);
 else if(e.key===' '&&e.target.tagName!=='BUTTON')launch();else return;ui()});

function sim(a,p,sx,sy){a*=Math.PI/180;let X=sx+Math.cos(a)*18,Y=sy-Math.sin(a)*18,vx=Math.cos(a)*p*.1,vy=-Math.sin(a)*p*.1;
 for(let i=0;i<900;i++){vx+=wind;vy+=G;X+=vx;Y+=vy;if(X<0||X>=W)return null;if(Y>=h[Math.round(X)])return{x:X,y:Y}}return null}
function aiTurn(){const me=tanks[1],foe=tanks[0];let best=null,bd=1e9;
 for(let i=0;i<260;i++){const a=20+Math.random()*140,p=20+Math.random()*80,r=sim(a,p,me.x,gy(me)-12);if(!r)continue;
  const d=Math.hypot(r.x-foe.x,r.y-(gy(foe)-6));if(d<bd){bd=d;best={a,p}}}
 if(!best)best={a:120,p:60};
 me.a=Math.round(clamp(best.a+(Math.random()-.5)*5,0,180));me.p=Math.round(clamp(best.p+(Math.random()-.5)*5,10,100));ui();
 aiTimer=setTimeout(launch,700)}

function explode(px,py){boom={x:px,y:py,t:0};
 for(let i=Math.max(0,Math.floor(px-R));i<Math.min(W,px+R);i++){const dx=i-px,s=Math.sqrt(Math.max(0,R*R-dx*dx));if(py-s<h[i])h[i]=clamp(Math.max(h[i],py+s),0,H)}
 tanks.forEach(t=>{const d=Math.hypot(t.x-px,gy(t)-6-py);if(d<R+22){t.hp=Math.max(0,t.hp-Math.max(4,Math.round(70*(1-d/(R+22)))))}});
 state='boom';t0=performance.now()}
function step(){const s=shot;s.vx+=wind;s.vy+=G;s.x+=s.vx;s.y+=s.vy;s.trail.push([s.x,s.y]);if(s.trail.length>40)s.trail.shift();
 if(s.x<-20||s.x>W+20||s.y>H+20){shot=null;endTurn();return}
 const xi=clamp(Math.round(s.x),0,W-1);
 if(s.y>=h[xi]){explode(s.x,s.y);shot=null;return}
 for(let i=0;i<2;i++){if(i===cur&&s.trail.length<8)continue;const t=tanks[i];if(Math.hypot(s.x-t.x,s.y-(gy(t)-6))<13){explode(s.x,s.y);shot=null;return}}}
function endTurn(){const dead=tanks.findIndex(t=>t.hp<=0);
 if(dead>=0){state='over';const w=1-dead;msg(`<b style="color:${cols[w]}">${names[w]} wins!</b> Press New battle to play again.`);return}
 cur=1-cur;newWind();state='aim';ui();msg();if(isCpu()){msg('Orange is aiming…');aiTimer=setTimeout(aiTurn,600)}}

function drawTank(t,i){const y=gy(t),x0=t.x;x.save();x.translate(x0,y);
 x.fillStyle=cols[i];x.beginPath();x.roundRect(-14,-10,28,10,3);x.fill();x.fillRect(-9,-15,18,6);
 const a=t.a*Math.PI/180;x.strokeStyle=cols[i];x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(0,-12);x.lineTo(Math.cos(a)*20,-12-Math.sin(a)*20);x.stroke();
 x.fillStyle='#0008';x.fillRect(-18,-30,36,5);x.fillStyle=t.hp>40?'#7ee787':'#f2b01e';x.fillRect(-18,-30,36*t.hp/100,5);
 if(i===cur&&state==='aim'){x.fillStyle='#e9edf1';x.beginPath();x.moveTo(0,-38);x.lineTo(-5,-46);x.lineTo(5,-46);x.fill()}
 x.restore()}
function draw(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10131a');g.addColorStop(.7,'#1f2733');g.addColorStop(1,'#4a2c22');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#f26a21';x.beginPath();x.arc(640,110,34,0,7);x.fill();
 x.fillStyle='#252a33';x.beginPath();x.moveTo(0,H);for(let i=0;i<W;i++)x.lineTo(i,h[i]);x.lineTo(W,H);x.fill();
 x.strokeStyle='#3a4150';x.lineWidth=2;x.beginPath();for(let i=0;i<W;i++)i?x.lineTo(i,h[i]):x.moveTo(i,h[i]);x.stroke();
 tanks.forEach(drawTank);
 if(shot){x.strokeStyle='#fff6';x.lineWidth=2;x.beginPath();shot.trail.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(shot.x,shot.y,4,0,7);x.fill()}
 if(boom){const k=boom.t;x.globalAlpha=1-k;x.fillStyle='#ffb36b';x.beginPath();x.arc(boom.x,boom.y,R*(.4+k*.8),0,7);x.fill();x.fillStyle='#f26a21';x.beginPath();x.arc(boom.x,boom.y,R*(.2+k*.5),0,7);x.fill();x.globalAlpha=1}
 if(state==='over'){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='400 52px Anton,Impact,sans-serif';x.textAlign='center';
  const w=tanks[0].hp>0?0:1;x.fillText(names[w]+' wins!',W/2,H/2);x.textAlign='left'}}
function loop(now){if(state==='fly')for(let i=0;i<3&&shot;i++)step();
 if(state==='boom'){boom.t=(now-t0)/600;if(boom.t>=1){boom=null;endTurn()}}
 draw();requestAnimationFrame(loop)}
newGame();requestAnimationFrame(loop);
})();

/* ================= SNAKE ================= */
const sc=$('snake'),sx=sc.getContext('2d'),N=20,CS=20;
let snake,dir,queue,food,score,best=0,alive,started,paused,timer;
try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
$('hi').textContent=best;
function sReset(){clearTimeout(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};queue=[];score=0;alive=true;started=false;paused=false;$('sc').textContent=0;place();sDraw()}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function turn(d){const v={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[d],last=queue.length?queue[queue.length-1]:dir;
 if(v[0]===-last.x&&v[1]===-last.y||(v[0]===last.x&&v[1]===last.y))return;queue.push({x:v[0],y:v[1]});
 if(!started&&alive){started=true;tick()}}
function tick(){if(!alive||paused)return;if(queue.length)dir=queue.shift();
 const hd={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(hd.x<0||hd.y<0||hd.x>=N||hd.y>=N||snake.some((s,i)=>i<snake.length-1&&s.x===hd.x&&s.y===hd.y)){alive=false;sDraw();return}
 snake.unshift(hd);
 if(hd.x===food.x&&hd.y===food.y){score++;$('sc').textContent=score;if(score>best){best=score;$('hi').textContent=best;try{localStorage.setItem('snakeBest',best)}catch(e){}}place()}else snake.pop();
 sDraw();timer=setTimeout(tick,Math.max(55,125-score*3))}
function snakePause(on){if(!started||!alive)return;paused=on;if(on)clearTimeout(timer);else tick();sDraw()}
function sDraw(){sx.fillStyle='#16181d';sx.fillRect(0,0,400,400);
 sx.fillStyle='#1d2027';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)sx.fillRect(i*CS,j*CS,CS,CS);
 sx.fillStyle='#f26a21';sx.beginPath();sx.arc(food.x*CS+10,food.y*CS+10,7,0,7);sx.fill();
 snake.forEach((s,i)=>{sx.fillStyle=i?'#00d2ff':'#e9edf1';sx.beginPath();sx.roundRect(s.x*CS+1,s.y*CS+1,CS-2,CS-2,i?5:8);sx.fill()});
 const m=!alive?['Game over','Press any arrow or Restart']:paused?['Paused','Space to resume']:!started?['Ready?','Press an arrow key to start']:null;

addEventListener('keydown',e=>{if(active!=='snake')return;
 const k={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r'}[e.key];

 if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(!alive)sReset();return}
